name = "ahmed-chat-proxy"
main = "chat-proxy.js"
compatibility_date = "2024-01-01"

# Set the Z.ai (api.z.ai) GLM Coding Plan and Groq API keys as Cloudflare secrets:
#   wrangler secret put ZAI_API_KEY
#   wrangler secret put GROQ_API_KEY
# (The binding name `ZAI_API_KEY` is retained for backward compatibility with
# existing deployments; the value it holds is an api.z.ai GLM Coding Plan key.)
# These keys are NEVER exposed to the client — they live only in the Worker's environment.

# Keep ALLOW_LOCALHOST disabled in production; set to "true" (or pass
# `--var ALLOW_LOCALHOST:true` to `wrangler dev`) only for local development
# from http://localhost:3000.
[vars]
ALLOW_LOCALHOST = "false"

# Optional: bind a KV namespace to enable simple IP-based rate limiting.
# Create the namespace first with `wrangler kv namespace create CHAT_RATE_KV`,
# then paste its id below and remove the leading `#`.
# [[kv_namespaces]]
# binding = "CHAT_RATE_KV"
# id = "your-kv-namespace-id-here"

# Native per-IP limit: 60 requests per minute at each Cloudflare location.
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
