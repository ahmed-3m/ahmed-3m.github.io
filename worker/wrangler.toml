name = "ahmed-chat-proxy"
main = "chat-proxy.js"
compatibility_date = "2024-01-01"

# Secrets, set by the owner from this folder (never committed, never in [vars]):
#   npx wrangler secret put ZAI_API_KEY    (an api.z.ai GLM Coding Plan key)
#   npx wrangler secret put GROQ_API_KEY
# A missing key makes that provider answer 503 "unavailable". See README.md.

# Settings. A value that is missing or invalid falls back to the default shown here, and a
# model outside the Worker's allowlist (worker/lib/settings.js) falls back to its default.
[vars]
# Keep "false" in production. For `wrangler dev`, put ALLOW_LOCALHOST=true in worker/.dev.vars.
ALLOW_LOCALHOST = "false"
PROMPT_URL = "https://ahmed-3m.github.io/genie/prompt.json"
ZAI_FAST_MODEL = "glm-5.3-flash"
ZAI_DEEP_MODEL = "glm-5.4"
GROQ_MODEL = "openai/gpt-oss-20b"
FAST_MAX_TOKENS = "900"
DEEP_MAX_TOKENS = "1600"
TEMPERATURE = "0.3"
ZAI_REASONING_EFFORT = "low"

# Per-client limit: 8 requests a minute for each IPv4 address or IPv6 /64, counted at each
# Cloudflare location. Without this binding the Worker answers 503 and calls no model.
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
