name: Daily site health check

# Dependency-light production canary: no npm ci, no build — just curl + node
# one-liners against the live Pages site and the repo. Each check is its own
# named step so a failure email names exactly what rotted.
#
# News freshness is live/repo date parity (hard fail) plus last scheduled
# news-update.yml success (hard fail). Editorial age > 7 days is a warning
# only — quiet weeks must not fail the job.
#
# 06:45 UTC on purpose: 22 minutes after the 06:23 news run it supervises,
# so a failed news pipeline shows up here the same morning.

on:
  schedule:
    - cron: "45 6 * * *" # Daily 06:45 UTC
  workflow_dispatch:

permissions:
  contents: read # only for the shallow checkout used by the news-freshness check
  actions: read # gh run list of the last scheduled news-update.yml run

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Site up + key assets return HTTP 200
        shell: bash
        run: |
          set -u
          base="https://ahmed-3m.github.io"
          paths=(
            "/"
            "/news/"
            "/blog/"
            "/cv.pdf"
            "/Mohammed_Ahmed_Thesis_Diffusion_OOD_Detection.pdf"
            "/sitemap.xml"
            "/sitemap-pages.xml"
            "/case-studies/diffusion-ood/"
            "/case-studies/inkjet-ood/"
            "/about/"
            "/research/"
            "/case-studies/sihem/"
            "/impressum/"
            "/privacy/"
            "/feed.xml"
            "/news/feed.xml"
            "/llms.txt"
            "/llms-full.txt"
          )
          fail=0
          for p in "${paths[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$base$p") || code="000"
            if [ "$code" = "200" ]; then
              echo "OK   $base$p -> 200"
            else
              echo "::error::$base$p returned HTTP $code (expected 200)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Site/assets check failed — the Pages site or a key asset is broken, or the last deploy failed."
          fi
          exit $fail

      - name: Checkout (shallow, for news freshness)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Deep pages return 200 (newest blog post)
        shell: bash
        run: |
          # Deep-page canaries added 2026-11-07 (issue #182)
          set -euo pipefail
          # Newest blog slug from the meta list: one `slug` + `date` string
          # literal pair per post, both indented four spaces (translation and
          # citation fields sit deeper). The (.)…\1 / (.)…\2 captures accept
          # either quote style. ISO dates sort lexicographically.
          pairs=$(sed -nE 's/^    (.)slug\1: (.)([a-z0-9-]+)\2,$/\3/p; s/^    (.)date\1: (.)([0-9]{4}-[0-9]{2}-[0-9]{2})\2,$/\3/p' src/lib/blog-posts-meta.ts)
          if [ -z "$pairs" ]; then
            echo "::error::Could not parse any slug/date pairs from src/lib/blog-posts-meta.ts"
            exit 1
          fi
          slug=$(printf '%s\n' "$pairs" | paste - - | sort -k2,2 | tail -n 1 | cut -f1)
          if [ -z "$slug" ]; then
            echo "::error::Parsed slug/date pairs from src/lib/blog-posts-meta.ts but found no newest slug"
            exit 1
          fi
          echo "Newest blog post: $slug"
          url="https://ahmed-3m.github.io/blog/$slug/"
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$url") || code="000"
          if [ "$code" != "200" ]; then
            echo "::error::$url returned HTTP $code (expected 200) — the newest post's deep page is broken or the deploy is stale"
            exit 1
          fi
          echo "OK   $url -> 200"

      - name: News live/repo parity
        shell: bash
        run: node .github/news/check-news-health.mjs live

      - name: News schedule health (< 36h window & stall detection)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: node .github/news/check-news-health.mjs schedule

      - name: Weekly catalog link-rot audit (non-blocking warnings)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            node .github/news/check-news-links.mjs --warn-only
          else
            echo "Skipping full 200-URL link-rot audit until Sunday UTC (day=$(date -u +%u))."
          fi

      - name: Chat widget present on homepage
        shell: bash
        run: |
          html="$(curl -s -L --max-time 30 https://ahmed-3m.github.io/)"
          if [ -z "$html" ]; then
            echo "::error::Homepage fetch returned an empty body — the site may be down (the assets step should also fail)."
            exit 1
          fi
          if printf '%s' "$html" | grep -q 'ahmed-chatbot-panel' || printf '%s' "$html" | grep -q 'Ask Genie'; then
            echo "OK: chat widget mount found in homepage HTML."
          else
            echo "::error::Chat widget mount missing from homepage HTML (neither 'ahmed-chatbot-panel' nor 'Ask Genie' found). The ChatBot component may have stopped rendering, or the deployed bundle is stale."
            exit 1
          fi

      - name: Chat proxy Worker CORS preflight returns 204
        env:
          CHAT_PROXY_URL: ${{ vars.NEXT_PUBLIC_CHAT_PROXY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CHAT_PROXY_URL" ]; then
            echo "NEXT_PUBLIC_CHAT_PROXY_URL is unset — Genie runs in curated-only mode; skipping proxy canary."
            exit 0
          fi
          headers_file="$RUNNER_TEMP/proxy-cors.headers"
          code=$(curl -s -D "$headers_file" -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://ahmed-3m.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: Content-Type' \
            --max-time 20 "$CHAT_PROXY_URL") || code="000"
          if [ "$code" != "204" ]; then
            echo "::error::Chat proxy OPTIONS preflight to $CHAT_PROXY_URL returned HTTP $code (expected 204)"
            exit 1
          fi
          if ! tr -d '\r' < "$headers_file" | grep -qi '^access-control-allow-origin: *https://ahmed-3m\.github\.io$'; then
            echo "::error::Chat proxy OPTIONS response missing Access-Control-Allow-Origin: https://ahmed-3m.github.io"
            cat "$headers_file"
            exit 1
          fi
          echo "OK   $CHAT_PROXY_URL OPTIONS preflight -> 204 (ACAO verified)"
