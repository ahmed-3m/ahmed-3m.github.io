name: Daily site health check

# Dependency-light production canary: no npm ci, no build — just curl + node
# one-liners against the live Pages site and the repo. Each check is its own
# named step so a failure email names exactly what rotted.
#
# News freshness is live/repo date parity (hard fail) plus last scheduled
# news-update.yml success (hard fail). Editorial age > 7 days is a warning
# only — quiet weeks must not fail the job.
#
# 06:45 UTC on purpose: 22 minutes after the 06:23 news run it supervises,
# so a failed news pipeline shows up here the same morning.

on:
  schedule:
    - cron: "45 6 * * *" # Daily 06:45 UTC
  workflow_dispatch:

permissions:
  contents: read # only for the shallow checkout used by the news-freshness check
  actions: read # gh run list of the last scheduled news-update.yml run

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Site up + key assets return HTTP 200
        shell: bash
        run: |
          set -u
          base="https://ahmed-3m.github.io"
          paths=(
            "/"
            "/news/"
            "/blog/"
            "/cv.pdf"
            "/Mohammed_Ahmed_Thesis_Diffusion_OOD_Detection.pdf"
            "/sitemap.xml"
          )
          fail=0
          for p in "${paths[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$base$p") || code="000"
            if [ "$code" = "200" ]; then
              echo "OK   $base$p -> 200"
            else
              echo "::error::$base$p returned HTTP $code (expected 200)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Site/assets check failed — the Pages site or a key asset is broken, or the last deploy failed."
          fi
          exit $fail

      - name: Checkout (shallow, for news freshness)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: News live/repo date parity
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -s -o "$RUNNER_TEMP/news.html" -w '%{http_code}' -L --max-time 30 https://ahmed-3m.github.io/news/) || code="000"
          if [ "$code" != "200" ]; then
            echo "::error::https://ahmed-3m.github.io/news/ returned HTTP $code (expected 200)"
            exit 1
          fi
          node <<'EOF'
          const { readFileSync } = require('node:fs')
          const html = readFileSync(process.env.RUNNER_TEMP + '/news.html', 'utf8')
          const live = [...html.matchAll(/"datePublished":"(\d{4}-\d{2}-\d{2})"/g)].map(m => m[1])
          const repo = JSON.parse(readFileSync('src/lib/news-items.json', 'utf8')).map(i => i.date)
          if (live.length === 0) process.exit(1)
          const liveNewest = live.sort().at(-1)
          const repoNewest = repo.sort().at(-1)
          if (liveNewest !== repoNewest) {
            console.error(`::error::Live newest ${liveNewest} != repo newest ${repoNewest}`)
            process.exit(1)
          }
          const today = new Date().toISOString().slice(0, 10)
          if (liveNewest > today) {
            console.error(`::error::Live news has a future date ${liveNewest}`)
            process.exit(1)
          }
          const age = (Date.now() - Date.parse(liveNewest + 'T00:00:00Z')) / 86400000
          if (age > 7) console.warn(`::warning::Newest item is ${age.toFixed(1)} days old (quiet days are allowed)`)
          console.log(`Live/repo newest ${liveNewest} (${age.toFixed(1)} days old; editorial age is a warning only)`)
          EOF

      - name: Last scheduled news-update succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          json=$(gh run list --workflow news-update.yml --branch main --event schedule --limit 1 --json conclusion,url,status,createdAt)
          echo "$json"
          if [ "$json" = "[]" ]; then
            echo "::error::No scheduled news-update.yml runs found on main"
            exit 1
          fi
          conclusion=$(printf '%s' "$json" | jq -r '.[0].conclusion // empty')
          url=$(printf '%s' "$json" | jq -r '.[0].url')
          status=$(printf '%s' "$json" | jq -r '.[0].status')
          echo "Last scheduled news-update: status=$status conclusion=$conclusion $url"
          if [ "$conclusion" = "failure" ]; then
            echo "::error::Last scheduled news-update.yml run is failure: $url"
            exit 1
          fi

      - name: Chat widget present on homepage
        shell: bash
        run: |
          html="$(curl -s -L --max-time 30 https://ahmed-3m.github.io/)"
          if [ -z "$html" ]; then
            echo "::error::Homepage fetch returned an empty body — the site may be down (the assets step should also fail)."
            exit 1
          fi
          if printf '%s' "$html" | grep -q 'ahmed-chatbot-panel' || printf '%s' "$html" | grep -q 'Ask Genie'; then
            echo "OK: chat widget mount found in homepage HTML."
          else
            echo "::error::Chat widget mount missing from homepage HTML (neither 'ahmed-chatbot-panel' nor 'Ask Genie' found). The ChatBot component may have stopped rendering, or the deployed bundle is stale."
            exit 1
          fi
