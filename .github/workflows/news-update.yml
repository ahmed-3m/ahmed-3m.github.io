name: Daily news update

# Collects recent AI / agentic-AI news with GLM-5.2 (via Z.ai, api.z.ai — Anthropic-format endpoint)
# + the Exa research MCP. The research job prints a NewsDelta on stdout (no Write tool).
# Validate sanitizes that delta against current main. Publish applies it to *current* main
# (no rebase, no agents-work push). Fully serverless: this Action IS the backend. Git is the
# dedup store.
#
# Runs daily. On a quiet day the agent prints { "items": [] } and publish is a no-op.
#
# Pinned 2026-09-07:
#   claude-code@2.1.263 (the npm "latest" of 2026-09-06, the version the last
#   green run installed). DO NOT re-pin from --tag=stable: for this package
#   stable (2.1.236) is OLDER than latest, and 2.1.236 rejects non-Anthropic
#   model IDs (unrecognized_model for glm-5.2) → agent emits no JSON → the
#   2026-09-07 news outage, see issue #67.
#   npm view exa-mcp-server version → 3.4.1
#
# Required repository secrets:
#   BIGMODEL_NEWS_TOKEN         - private Z.ai (api.z.ai) API key for the news agent (NOT exposed in the client bundle).
#                                 Falls back to the pre-migration ZAI_NEWS_TOKEN secret if unset.
#   NEXT_PUBLIC_BIGMODEL_TOKEN  - public, rate-limited BigModel key for the portfolio chatbot (inlined in the static bundle).
#   EXA_API_KEY                 - Exa API key for the research MCP (https://exa.ai).

on:
  schedule:
    - cron: "23 6 * * *" # Daily 06:23 UTC (off-round minute to dodge GH load peaks)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the agent + validation but do NOT publish (no commit/merge/deploy)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      # NO npm ci — research must not install the app or give the agent a writable tree to "validate".
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code@2.1.263 # 2.1.236 (npm "stable") breaks GLM model IDs — see header

      - name: Self-test agent-failure classification
        # Runs BEFORE the agent (unlike the link-check self-test, which gates the
        # step it belongs to) because the classifier is consumed by the agent step:
        # pinning it afterwards would skip it on exactly the failing runs where its
        # verdict decides what the operator is told. Pins the auth-vs-transient and
        # BigModel-vs-Exa boundaries so a future tweak to the patterns cannot
        # silently start reading "401(k)" in a fetched article as a rejected key.
        run: node .github/news/classify-agent-failure.mjs --self-test

      - name: Self-test agent-stdout extractor
        run: node .github/news/parse-agent-stdout.mjs --self-test

      - name: Collect news delta on stdout
        env:
          # Z.ai (international) Anthropic-format endpoint. Claude Code speaks
          # the Anthropic Messages API, NOT OpenAI /chat/completions, so this
          # must use /api/anthropic — the Coding Plan /api/coding/paas/v4 path
          # does NOT support Claude Code.
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.BIGMODEL_NEWS_TOKEN || secrets.ZAI_NEWS_TOKEN }}
          ANTHROPIC_MODEL: glm-5.2
          ANTHROPIC_SMALL_FAST_MODEL: glm-4.7-flash
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          set -euo pipefail
          # Preflight the credentials. A missing or empty secret is a
          # configuration error, not a transient one: no amount of model-tier
          # fallback can fix it, and the loop below would otherwise report it as
          # "BigModel likely broadly overloaded" — actively misleading. Name the
          # secret that is actually missing and stop.
          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "::error::Secrets BIGMODEL_NEWS_TOKEN (and fallback ZAI_NEWS_TOKEN) are unset or empty, so the agent cannot authenticate against $ANTHROPIC_BASE_URL (Claude Code reports 'Not logged in'). Set one with: gh secret set BIGMODEL_NEWS_TOKEN"
            exit 1
          fi
          if [ -z "$EXA_API_KEY" ]; then
            echo "::error::Secret EXA_API_KEY is unset or empty, so the Exa research MCP cannot authenticate. Set it with: gh secret set EXA_API_KEY"
            exit 1
          fi
          # Fall back through GLM tiers on transient overload (529): the newest
          # model is the most capacity-constrained, so older tiers often succeed.
          # Short backoff (15s) because the run is daily — failing fast and letting
          # tomorrow's run pick it up beats sitting idle for minutes on overload.
          models="glm-5.2 glm-5 glm-4.7"
          attempt=0
          for m in $models; do
            attempt=$((attempt + 1))
            echo "::group::Agent attempt $attempt (model: $m)"
            log="$RUNNER_TEMP/agent-attempt-$attempt.log"
            err="$RUNNER_TEMP/agent-attempt-$attempt.err"
            set +e
            ANTHROPIC_MODEL="$m" claude -p "$(cat .github/news/task.md)" \
              --mcp-config .github/news/exa-mcp.json \
              --allowedTools "Read,mcp__exa" \
              --permission-mode bypassPermissions \
              --output-format json \
              --max-turns 60 \
              > "$log" 2>"$err"
            code=$?
            set -e
            cat "$err" >&2 || true
            echo "::endgroup::"
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::Research agent dirtied the worktree; refusing to continue."
              git status --porcelain
              exit 1
            fi
            if [ "$code" -eq 0 ]; then
              # Missing or non-JSON stdout is a hard fail — never invent {items:[]}.
              node .github/news/parse-agent-stdout.mjs "$log" > "$RUNNER_TEMP/news-delta.json"
              echo "Succeeded with $m."
              exit 0
            fi
            combined="$RUNNER_TEMP/agent-attempt-$attempt.combined.log"
            cat "$log" "$err" > "$combined"
            case "$(node .github/news/classify-agent-failure.mjs "$combined")" in
              exa-auth)
                echo "::error::The Exa MCP rejected its API key — this is not an overload. Check that EXA_API_KEY is a current key from https://exa.ai. Set it with: gh secret set EXA_API_KEY"
                exit 1
                ;;
              model-auth)
                echo "::error::The model API rejected the credentials — this is not an overload. Check that BIGMODEL_NEWS_TOKEN is a current Z.ai (api.z.ai) key valid for $ANTHROPIC_BASE_URL (an open.bigmodel.cn key will NOT work against api.z.ai)."
                exit 1
                ;;
            esac
            echo "Attempt $attempt ($m) failed (exit $code) — likely a transient overload. Trying next tier in 15s..."
            sleep 15
          done
          echo "Agent failed across all model tiers — BigModel likely broadly overloaded. The daily run will retry tomorrow."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: news-delta
          path: ${{ runner.temp }}/news-delta.json
          if-no-files-found: error

  validate:
    needs: research
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANTHROPIC_AUTH_TOKEN: ""
      EXA_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: news-delta
          path: ${{ runner.temp }}

      - name: Sanitize delta against current main
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile, lstat } from 'node:fs/promises'
          import { applyNewsDelta, parseNewsItems } from './src/lib/news.ts'
          const path = process.env.RUNNER_TEMP + '/news-delta.json'
          const st = await lstat(path)
          if (!st.isFile() || st.isSymbolicLink() || st.size > 64_000) {
            throw new Error('delta must be a regular file ≤ 64KB')
          }
          const delta = JSON.parse(await readFile(path, 'utf8'))
          const existing = parseNewsItems(JSON.parse(await readFile('src/lib/news-items.json', 'utf8')))
          const next = applyNewsDelta(existing, delta)
          // Write sanitized delta (parsed items only), NOT the full catalog.
          const sanitized = { items: next.slice(existing.length) }
          await writeFile(path, JSON.stringify(sanitized) + '\n')
          EOF

      - name: Build with delta applied (local copy only)
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises'
          import { applyNewsDelta, parseNewsItems } from './src/lib/news.ts'
          const delta = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/news-delta.json', 'utf8'))
          const existing = parseNewsItems(JSON.parse(await readFile('src/lib/news-items.json', 'utf8')))
          const next = applyNewsDelta(existing, delta)
          await writeFile('src/lib/news-items.json', JSON.stringify(next, null, 2) + '\n')
          EOF
          npm run build
          node .github/news/news-selftest.mjs
          node .github/news/check-news-links.mjs --self-test
          node .github/news/check-news-links.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: news-delta-sanitized
          path: ${{ runner.temp }}/news-delta.json
          if-no-files-found: error

  publish:
    needs: validate
    if: github.event_name == 'schedule' || github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: news-delta-sanitized
          path: ${{ runner.temp }}

      - name: Apply sanitized delta to current main
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises'
          import { applyNewsDelta, parseNewsItems } from './src/lib/news.ts'
          const delta = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/news-delta.json', 'utf8'))
          const existing = parseNewsItems(JSON.parse(await readFile('src/lib/news-items.json', 'utf8')))
          const next = applyNewsDelta(existing, delta)
          await writeFile('src/lib/news-items.json', JSON.stringify(next, null, 2) + '\n')
          EOF
          npm run build
          node .github/news/check-news-links.mjs

      - name: Fast-forward commit of JSON only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/lib/news-items.json; then
            echo "No new news items today — nothing to publish."
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/news-items.json
          git commit -m "chore(news): daily automated update"
          git fetch origin main
          git push origin HEAD:main
          # No rebase. A non-fast-forward push fails the job and alerts.
          # No agents-work push.
          gh workflow run deploy.yml --ref main

  # publish is skipped on dry-run; needs.*.result for a skipped job is
  # skipped, which is not failure. A dry-run research/validate failure still
  # alerts. First-failure (open or comment), not a two-run counter.
  alert:
    needs: [research, validate, publish]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update durable first-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[ops] news-update failed"
          body="Workflow \`news-update\` failed: $RUN_URL"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
