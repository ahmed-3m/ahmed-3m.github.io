name: Daily news update

# Collects recent AI / agentic-AI news with GLM-5.2 (via Z.ai, api.z.ai — Anthropic-format endpoint)
# + the Exa research MCP, dedupes against what's already published, validates, and
# auto-merges to main on green. Fully serverless: this Action IS the backend. Git is the dedup store.
#
# Runs daily. On a quiet day with nothing new, the agent writes no items and the
# publish step is a no-op — so a daily cadence costs little more than weekly but
# keeps the page noticeably fresher.
#
# Required repository secrets:
#   BIGMODEL_NEWS_TOKEN         - private Zhipu BigModel API key for the news agent (NOT exposed in the client bundle).
#   NEXT_PUBLIC_BIGMODEL_TOKEN  - public, rate-limited BigModel key for the portfolio chatbot (inlined in the static bundle).
#   EXA_API_KEY                 - Exa API key for the research MCP (https://exa.ai).

on:
  schedule:
    - cron: "23 6 * * *" # Daily 06:23 UTC (off-round minute to dodge GH load peaks)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the agent + validation but do NOT publish (no commit/merge/deploy)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write # to dispatch the deploy workflow after a successful merge

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Self-test agent-failure classification
        # Runs BEFORE the agent (unlike the link-check self-test, which gates the
        # step it belongs to) because the classifier is consumed by the agent step:
        # pinning it afterwards would skip it on exactly the failing runs where its
        # verdict decides what the operator is told. Pins the auth-vs-transient and
        # BigModel-vs-Exa boundaries so a future tweak to the patterns cannot
        # silently start reading "401(k)" in a fetched article as a rejected key.
        run: node .github/news/classify-agent-failure.mjs --self-test

      - name: Collect & write news (GLM-5.2 via BigModel + Exa MCP)
        env:
          # Z.ai (international) Anthropic-format endpoint. Claude Code speaks
          # the Anthropic Messages API, NOT OpenAI /chat/completions, so this
          # must use /api/anthropic — the Coding Plan /api/coding/paas/v4 path
          # does NOT support Claude Code.
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.BIGMODEL_NEWS_TOKEN }}
          ANTHROPIC_MODEL: glm-5.2
          ANTHROPIC_SMALL_FAST_MODEL: glm-4.7-flash
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          set +e
          # Preflight the credentials. A missing or empty secret is a
          # configuration error, not a transient one: no amount of model-tier
          # fallback can fix it, and the loop below would otherwise report it as
          # "BigModel likely broadly overloaded" — actively misleading. Name the
          # secret that is actually missing and stop.
          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "::error::Secret BIGMODEL_NEWS_TOKEN is unset or empty, so the agent cannot authenticate against $ANTHROPIC_BASE_URL (Claude Code reports 'Not logged in'). Set it with: gh secret set BIGMODEL_NEWS_TOKEN"
            exit 1
          fi
          if [ -z "$EXA_API_KEY" ]; then
            echo "::error::Secret EXA_API_KEY is unset or empty, so the Exa research MCP cannot authenticate. Set it with: gh secret set EXA_API_KEY"
            exit 1
          fi
          # Fall back through GLM tiers on transient overload (529): the newest
          # model is the most capacity-constrained, so older tiers often succeed.
          # Short backoff (15s) because the run is daily — failing fast and letting
          # tomorrow's run pick it up beats sitting idle for minutes on overload.
          models="glm-5.2 glm-5 glm-4.7"
          attempt=0
          for m in $models; do
            attempt=$((attempt + 1))
            echo "::group::Agent attempt $attempt (model: $m)"
            # Reset any partial edits from a failed attempt before retrying.
            git checkout -- src/lib/news-items.ts 2>/dev/null || true
            log="$RUNNER_TEMP/agent-attempt-$attempt.log"
            # tee keeps the output in the (collapsed) log group while letting us
            # classify the failure; PIPESTATUS[0] is claude's code, not tee's.
            ANTHROPIC_MODEL="$m" claude -p "$(cat .github/news/task.md)" \
              --mcp-config .github/news/exa-mcp.json \
              --allowedTools "Read,Edit,Write,Bash(npm run build),mcp__exa" \
              --permission-mode bypassPermissions \
              --max-turns 60 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ $code -eq 0 ] && { echo "Succeeded with $m."; exit 0; }
            # A rejected credential fails identically on every tier, so don't
            # burn the remaining tiers (or the operator's time) pretending it
            # might be capacity. A present-but-invalid/expired/wrong-platform key
            # lands here rather than in the preflight above.
            #
            # The log is a single stream carrying both the model's errors and the
            # Exa MCP's, so the classifier attributes the failure before we name a
            # secret — telling the operator to rotate BIGMODEL_NEWS_TOKEN when it
            # was really Exa's key would just relocate the misdiagnosis. If the
            # classifier itself breaks, it prints nothing and we fall through to
            # the tier loop, i.e. the old behaviour.
            case "$(node .github/news/classify-agent-failure.mjs "$log")" in
              exa-auth)
                echo "::error::The Exa MCP rejected its API key — this is not an overload. Check that EXA_API_KEY is a current key from https://exa.ai. Set it with: gh secret set EXA_API_KEY"
                exit 1
                ;;
              model-auth)
                echo "::error::The model API rejected the credentials — this is not an overload. Check that BIGMODEL_NEWS_TOKEN is a current Z.ai (api.z.ai) key valid for $ANTHROPIC_BASE_URL (an open.bigmodel.cn key will NOT work against api.z.ai)."
                exit 1
                ;;
            esac
            echo "Attempt $attempt ($m) failed (exit $code) — likely a transient overload. Trying next tier in 15s..."
            sleep 15
          done
          echo "Agent failed across all model tiers — BigModel likely broadly overloaded. The daily run will retry tomorrow."
          exit 1

      - name: Validate build
        # Intentionally a second build: the agent already ran `npm run build` in
        # its sandbox for self-validation, but that was on the agent's in-flight
        # tree. This re-verifies the final committed state as the gate the
        # auto-merge pivots on. Belt-and-suspenders by design.
        run: npm run build

      - name: Self-test link-check policy
        # Pins HARD_FAIL classification so a future refactor cannot silently
        # re-introduce 5xx-as-hard-fail (or drop 404/410) without failing CI.
        run: node .github/news/check-news-links.mjs --self-test

      - name: Check news links
        run: node .github/news/check-news-links.mjs

      - name: Commit, push, and trigger deploy (auto-merge on green)
        if: github.event_name == 'schedule' || github.event.inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/lib/news-items.ts; then
            echo "No new news items today — nothing to publish."
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Path-scoped commit: ONLY the news data file is committed, even if the
          # agent incidentally touched other files. Constrains the blast radius.
          git commit -m "chore(news): daily automated update" -- src/lib/news-items.ts
          # Path-scoped commit leaves any incidental agent edits to other tracked
          # files unstaged. `git rebase` refuses a dirty tree, so drop that dirt
          # (only news-items.ts was committed — everything else is out of scope).
          git reset --hard HEAD
          # `main` may have moved (a PR merge, or the deploy workflow's own
          # commits) during the ~5-15 min this run took. Rebase our single-file
          # news commit on top before pushing so the push is fast-forward and
          # isn't silently rejected. The commit only ever touches news-items.ts,
          # so conflicts are effectively impossible unless main also edited it.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          # Keep the agents-work lane in sync with main (best-effort).
          git push origin HEAD:agents-work || echo "agents-work not fast-forwardable; skipping sync."
          # GITHUB_TOKEN pushes don't trigger other workflows, so kick deploy manually.
          gh workflow run deploy.yml --ref main
