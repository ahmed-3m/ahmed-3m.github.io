name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pages: write
  id-token: write

concurrency:
  # Separate lanes: production deploys (push/manual) never queue behind PR
  # builds, and a superseded PR run (new push to the same PR) is cancelled
  # instead of burning CI minutes on now-outdated commits.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_* tokens are inlined into the static JS bundle and are
          # publicly extractable. Use disposable, rate-limited free-tier keys only.
          # The news agent uses a separate private key (BIGMODEL_NEWS_TOKEN) — see news-update.yml.
          NEXT_PUBLIC_GROQ_TOKEN: ${{ secrets.NEXT_PUBLIC_GROQ_TOKEN }}
          NEXT_PUBLIC_BIGMODEL_TOKEN: ${{ secrets.NEXT_PUBLIC_BIGMODEL_TOKEN }}
          # Optional model overrides via GitHub repository variables. Unset or
          # empty vars fall back to the defaults compiled into ChatBot.tsx.
          NEXT_PUBLIC_GROQ_MODEL: ${{ vars.NEXT_PUBLIC_GROQ_MODEL }}
          NEXT_PUBLIC_BIGMODEL_MODEL: ${{ vars.NEXT_PUBLIC_BIGMODEL_MODEL }}

      - name: Package Pages artifact
        shell: sh
        run: |
          tar \
            --dereference --hard-dereference \
            --directory ./out \
            -cvf "$RUNNER_TEMP/github-pages.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # IndexNow (Bing/Yandex/Seznam/Naver): submit every sitemap URL right
      # after a deploy. The key is public by protocol design — it only works
      # together with the matching key file served from the site root
      # (public/b76fb92367b47563e98eeef50bd5b1df.txt).
      - name: Ping IndexNow
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          KEY="b76fb92367b47563e98eeef50bd5b1df"
          HOST="ahmed-3m.github.io"
          sleep 60  # let the Pages CDN settle before engines recrawl
          curl -sf --retry 3 "https://${HOST}/sitemap.xml" -o /tmp/sitemap.xml
          mapfile -t URLS < <(sed -n 's/.*<loc>\(.*\)<\/loc>.*/\1/p' /tmp/sitemap.xml)
          if [ "${#URLS[@]}" -eq 0 ]; then
            echo "No URLs parsed from sitemap — skipping IndexNow ping"; exit 0
          fi
          JSON=$(jq -n --arg host "$HOST" --arg key "$KEY" \
            --arg kl "https://${HOST}/${KEY}.txt" --args \
            '{host: $host, key: $key, keyLocation: $kl, urlList: $ARGS.positional}' "${URLS[@]}")
          echo "Pinging IndexNow with ${#URLS[@]} URLs"
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$JSON" -o /tmp/indexnow-response.txt -w "IndexNow HTTP %{http_code}\n"
          cat /tmp/indexnow-response.txt || true
