name: News delta CI

# Runs the exact checks that branch protection requires on main (quality,
# build) for a news-delta branch, so the news bot can land its sanctioned
# direct commit (AGENTS.md exception) without weakening protection:
#
#   1. news-update.yml publish pushes the validated JSON-only commit to a
#      throwaway news-delta/<run-id> branch,
#   2. dispatches THIS workflow on that ref,
#   3. waits for the quality/build check runs to report on the commit sha,
#   4. fast-forwards main with the proven sha. Required status checks are
#      satisfied per-commit, so GitHub accepts the push (a bare push of a
#      commit without check runs is rejected with GH006 — 2026-09-08).
#
# Trigger is workflow_dispatch, not push, because pushes made with the
# repository GITHUB_TOKEN do not raise push events (recursion guard).
#
# The job names MUST stay exactly `quality` and `build` — they are the
# required status check contexts configured on main. They mirror the
# same-named jobs in deploy.yml (minus artifact/deploy, which happen on
# main after the merge, not here).

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: news-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
