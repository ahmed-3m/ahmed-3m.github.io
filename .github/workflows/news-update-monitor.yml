name: News-update start monitor

# Fires when "Daily news update" completes. Catches YAML that cannot start
# (the in-workflow alert job never runs in that case). Duplicates comments
# on a normal job failure; that is acceptable. First-failure issue, not a
# consecutive-failure counter.

on:
  workflow_run:
    workflows: ["Daily news update"]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update durable first-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="[ops] news-update failed"
          url="${{ github.event.workflow_run.html_url }}"
          body="Workflow \`news-update\` failed: $url"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
