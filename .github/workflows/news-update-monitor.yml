name: News-update start monitor

# Fires when "Daily news update" completes. Catches YAML that cannot start
# (the in-workflow alert job never runs in that case). A normal job failure is
# reported by both this workflow and the in-workflow alert job; both dedupe on
# the run URL, so one failure still leaves one comment. First-failure issue,
# not a consecutive-failure counter.

on:
  workflow_run:
    workflows: ["Daily news update"]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update durable first-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="[ops] news-update failed"
          url="${{ github.event.workflow_run.html_url }}"
          body="Workflow \`news-update\` failed: $url"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            # one failure = one comment; a new run URL always comments
            last=$(gh issue view "$existing" --json comments --jq '.comments[-1].body // empty')
            if printf '%s' "$last" | grep -qF "$url"; then
              echo "Issue #$existing already reports $url — skipping duplicate comment."
              exit 0
            fi
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
