version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # eslint-config-next / typescript-eslint rejects TypeScript 7.0 (PR #295);
      # revisit once typescript-eslint ships TS >= 7 support.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
