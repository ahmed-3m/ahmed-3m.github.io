<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E0C8"/>
      <stop offset="1" stop-color="#18A7FF"/>
    </linearGradient>
    <mask id="ringMask">
      <rect width="100%" height="100%" fill="white"/>
      <rect x="360" y="40" width="80" height="140" fill="black" transform="rotate(20 400 110)"/>
      <rect x="72" y="320" width="80" height="140" fill="black" transform="rotate(-20 112 390)"/>
    </mask>
  </defs>

  <!-- transparent background -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- outer ring (masked to create gaps) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#g)" stroke-width="28" stroke-linecap="round" mask="url(#ringMask)"/>
</svg>